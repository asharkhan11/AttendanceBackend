services:
  # ── Go Attendance REST API Server ──────────────────────────────────────────
  api:
    container_name: attendance-api
    image: ${DOCKER_IMAGE_API:-attendance-api:latest}
    build:
      context: ..
      dockerfile: deployments/Dockerfile.api
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-../.env}
    environment:
      # Direct connection to remote DB Server Instance (155.248.241.83)
      DATABASE_URL: ${DATABASE_URL:-postgres://attendance_app:AttendanceApp2026@155.248.241.83:5432/attendance?sslmode=disable}
      PORT: ${PORT:-8080}
      ENV: ${ENV:-production}
    ports:
      - "0.0.0.0:8080:8080"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
