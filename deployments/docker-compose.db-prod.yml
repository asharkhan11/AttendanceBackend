services:
  # ── PostgreSQL Database Container ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: attendance-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-attendance}
      POSTGRES_USER: ${POSTGRES_USER:-attendance_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-AttendanceOwner2026}

    ports:
      - "0.0.0.0:5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../scripts/init_db.sql:/docker-entrypoint-initdb.d/00_init_db.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-attendance_owner} -d $${POSTGRES_DB:-attendance}"]
      interval: 5s
      timeout: 5s
      retries: 10

    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=16MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c max_worker_processes=4
      -c max_parallel_workers_per_gather=2
      -c max_parallel_workers=4
      -c max_parallel_maintenance_workers=2

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ── Database Migration & Seed Runner ───────────────────────────────────────
  db-init:
    container_name: attendance-db-init
    image: attendance-db-init:latest

    environment:
      MIGRATE_DATABASE_URL: postgres://attendance_owner:${POSTGRES_PASSWORD:-AttendanceOwner2026}@postgres:5432/${POSTGRES_DB:-attendance}?sslmode=disable
      DATABASE_URL: postgres://attendance_owner:${POSTGRES_PASSWORD:-AttendanceOwner2026}@postgres:5432/${POSTGRES_DB:-attendance}?sslmode=disable
      RUN_SEED: ${RUN_SEED:-false}
    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"

volumes:
  pgdata: