definitions:
  apperror.Code:
    enum:
    - VALIDATION_ERROR
    - UNAUTHORIZED
    - FORBIDDEN
    - NOT_FOUND
    - CONFLICT
    - INTERNAL_ERROR
    type: string
    x-enum-varnames:
    - CodeValidation
    - CodeUnauthorized
    - CodeForbidden
    - CodeNotFound
    - CodeConflict
    - CodeInternal
  apperror.FieldError:
    properties:
      field:
        type: string
      issue:
        type: string
    type: object
  dto.AssignClassTeacherRequest:
    properties:
      class_teacher_id:
        type: string
    type: object
  dto.BulkMarkRequest:
    properties:
      marks:
        items:
          $ref: '#/definitions/dto.MarkEntry'
        minItems: 1
        type: array
    required:
    - marks
    type: object
  dto.ChangePasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        minLength: 8
        type: string
    required:
    - current_password
    - new_password
    type: object
  dto.CopyClassesRequest:
    properties:
      source_academic_year_id:
        type: string
      target_academic_year_id:
        type: string
    required:
    - source_academic_year_id
    - target_academic_year_id
    type: object
  dto.CopyTeachersRequest:
    properties:
      class_mappings:
        additionalProperties:
          type: string
        description: map source class_id -> target class_id
        type: object
      source_academic_year_id:
        type: string
      target_academic_year_id:
        type: string
    required:
    - source_academic_year_id
    - target_academic_year_id
    type: object
  dto.CreateAcademicYearRequest:
    properties:
      end_date:
        type: string
      is_current:
        type: boolean
      name:
        maxLength: 50
        type: string
      start_date:
        type: string
    required:
    - end_date
    - name
    - start_date
    type: object
  dto.CreateClassRequest:
    properties:
      academic_year_id:
        type: string
      class_teacher_id:
        type: string
      grade_level:
        maximum: 12
        minimum: 1
        type: integer
      section:
        maxLength: 10
        type: string
    required:
    - grade_level
    - section
    type: object
  dto.CreateSessionRequest:
    properties:
      class_id:
        type: string
      period_number:
        type: integer
      session_date:
        type: string
    required:
    - class_id
    - session_date
    type: object
  dto.CreateStudentRequest:
    properties:
      admission_number:
        maxLength: 50
        type: string
      class_id:
        type: string
      dob:
        type: string
      full_name:
        maxLength: 255
        type: string
      gender:
        type: string
      guardian_name:
        type: string
      guardian_phone:
        type: string
      roll_number:
        maxLength: 20
        type: string
    required:
    - class_id
    - full_name
    - roll_number
    type: object
  dto.CreateTeacherRequest:
    properties:
      email:
        type: string
      full_name:
        maxLength: 255
        type: string
      password:
        minLength: 8
        type: string
      phone:
        type: string
    required:
    - email
    - full_name
    - password
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
      school_code:
        type: string
    required:
    - email
    - password
    - school_code
    type: object
  dto.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in_seconds:
        type: integer
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/dto.UserResp'
    type: object
  dto.LogoutRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  dto.MarkEntry:
    properties:
      remarks:
        type: string
      status:
        enum:
        - present
        - absent
        - late
        - excused
        type: string
      student_id:
        type: string
    required:
    - status
    - student_id
    type: object
  dto.PromoteStudentsRequest:
    properties:
      source_class_id:
        type: string
      student_ids:
        items:
          type: string
        minItems: 1
        type: array
      target_class_id:
        type: string
    required:
    - source_class_id
    - student_ids
    - target_class_id
    type: object
  dto.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  dto.ResetPasswordRequest:
    properties:
      new_password:
        minLength: 8
        type: string
    required:
    - new_password
    type: object
  dto.SingleMarkRequest:
    properties:
      remarks:
        type: string
      status:
        enum:
        - present
        - absent
        - late
        - excused
        type: string
    required:
    - status
    type: object
  dto.UpdateProfileRequest:
    properties:
      full_name:
        minLength: 2
        type: string
      phone:
        type: string
    required:
    - full_name
    type: object
  dto.UpdateStudentRequest:
    properties:
      admission_number:
        maxLength: 50
        type: string
      class_id:
        type: string
      dob:
        type: string
      full_name:
        maxLength: 255
        type: string
      gender:
        type: string
      guardian_name:
        type: string
      guardian_phone:
        type: string
      roll_number:
        maxLength: 20
        type: string
    required:
    - admission_number
    - class_id
    - full_name
    - roll_number
    type: object
  dto.UpdateTeacherRequest:
    properties:
      full_name:
        maxLength: 255
        type: string
      phone:
        type: string
    required:
    - full_name
    type: object
  dto.UserResp:
    properties:
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      phone:
        type: string
      role:
        type: string
      school_id:
        type: string
    type: object
  httpx.Envelope:
    properties:
      data: {}
      error:
        $ref: '#/definitions/httpx.ErrBody'
      meta:
        $ref: '#/definitions/httpx.Meta'
    type: object
  httpx.ErrBody:
    properties:
      code:
        $ref: '#/definitions/apperror.Code'
      details:
        items:
          $ref: '#/definitions/apperror.FieldError'
        type: array
      message:
        type: string
    type: object
  httpx.Meta:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  models.AcademicYear:
    properties:
      created_at:
        type: string
      end_date:
        type: string
      id:
        type: string
      is_archived:
        type: boolean
      is_current:
        type: boolean
      name:
        type: string
      school_id:
        type: string
      start_date:
        type: string
    type: object
  models.AttendanceSession:
    properties:
      class_id:
        type: string
      created_at:
        type: string
      finalized_at:
        type: string
      id:
        type: string
      is_finalized:
        type: boolean
      period_number:
        type: integer
      school_id:
        type: string
      session_date:
        type: string
      status:
        $ref: '#/definitions/models.SessionStatus'
      teacher_id:
        type: string
      updated_at:
        type: string
    type: object
  models.CreateHolidayRequest:
    properties:
      description:
        type: string
      holiday_date:
        description: YYYY-MM-DD
        type: string
      is_holiday:
        type: boolean
      title:
        type: string
    type: object
  models.DateHoliday:
    properties:
      created_at:
        type: string
      description:
        type: string
      holiday_date:
        type: string
      id:
        type: string
      is_holiday:
        type: boolean
      school_id:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  models.SessionStatus:
    enum:
    - open
    - closed
    type: string
    x-enum-varnames:
    - SessionOpen
    - SessionClosed
  models.Student:
    properties:
      admission_number:
        type: string
      class_id:
        type: string
      created_at:
        type: string
      dob:
        type: string
      full_name:
        type: string
      gender:
        type: string
      guardian_name:
        type: string
      guardian_phone:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      roll_number:
        type: string
      school_id:
        type: string
      updated_at:
        type: string
    type: object
  models.UpdateWeeklyScheduleRequest:
    properties:
      schedules:
        items:
          $ref: '#/definitions/models.WeeklyScheduleItem'
        type: array
    type: object
  models.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      phone:
        type: string
      role:
        $ref: '#/definitions/models.UserRole'
      school_id:
        type: string
      updated_at:
        type: string
    type: object
  models.UserRole:
    enum:
    - admin
    - teacher
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleTeacher
  models.WeeklySchedule:
    properties:
      created_at:
        type: string
      day_name:
        type: string
      day_of_week:
        description: 0=Sunday, 1=Monday, ..., 6=Saturday
        type: integer
      id:
        type: string
      is_working_day:
        type: boolean
      school_id:
        type: string
      updated_at:
        type: string
    type: object
  models.WeeklyScheduleItem:
    properties:
      day_of_week:
        type: integer
      is_working_day:
        type: boolean
    type: object
  repository.AuditLogRow:
    properties:
      changed_at:
        type: string
      changed_by_name:
        type: string
      class_name:
        type: string
      id:
        type: string
      new_status:
        type: string
      old_status:
        type: string
      roll_number:
        type: string
      session_date:
        type: string
      student_name:
        type: string
    type: object
  repository.ClassComparisonRow:
    properties:
      attendance_percentage:
        type: number
      class_id:
        type: string
      class_name:
        type: string
      grade_level:
        type: integer
      section:
        type: string
      total_students:
        type: integer
    type: object
  repository.ClassSummaryData:
    properties:
      absent:
        type: integer
      attendance_percentage:
        type: number
      class_id:
        type: string
      excused:
        type: integer
      late:
        type: integer
      present:
        type: integer
      total_records:
        type: integer
      total_sessions:
        type: integer
      total_students:
        type: integer
    type: object
  repository.ClassWithTeacher:
    properties:
      academic_year_id:
        type: string
      class_teacher_email:
        type: string
      class_teacher_id:
        type: string
      class_teacher_name:
        type: string
      created_at:
        type: string
      grade_level:
        type: integer
      id:
        type: string
      school_id:
        type: string
      section:
        type: string
    type: object
  repository.DefaulterRow:
    properties:
      attendancePct:
        format: float64
        type: number
      fullName:
        type: string
      rollNumber:
        type: string
      studentID:
        type: string
    type: object
  repository.MonthlyMatrixData:
    properties:
      class_id:
        type: string
      class_name:
        type: string
      days_in_month:
        type: integer
      month:
        type: integer
      students:
        items:
          $ref: '#/definitions/repository.MonthlyMatrixStudent'
        type: array
      year:
        type: integer
    type: object
  repository.MonthlyMatrixStudent:
    properties:
      admission_number:
        type: string
      daily_status:
        additionalProperties:
          type: string
        description: '"YYYY-MM-DD" -> "P", "A", "L", "E"'
        type: object
      full_name:
        type: string
      roll_number:
        type: string
      student_id:
        type: string
      total_absent:
        type: integer
      total_excused:
        type: integer
      total_late:
        type: integer
      total_present:
        type: integer
    type: object
  repository.NextStudentInfo:
    properties:
      last_roll_number:
        type: string
      next_admission_number:
        type: string
      suggested_next_roll_number:
        type: string
    type: object
  repository.SchoolDefaulterRow:
    properties:
      admission_number:
        type: string
      attendance_pct:
        type: number
      class_name:
        type: string
      full_name:
        type: string
      guardian_name:
        type: string
      guardian_phone:
        type: string
      present_count:
        type: integer
      roll_number:
        type: string
      student_id:
        type: string
      total_sessions:
        type: integer
    type: object
  repository.SchoolOverviewData:
    properties:
      class_comparisons:
        items:
          $ref: '#/definitions/repository.ClassComparisonRow'
        type: array
      overall_attendance_pct:
        type: number
      total_classes:
        type: integer
      total_defaulters:
        type: integer
      total_sessions:
        type: integer
      total_students:
        type: integer
    type: object
  repository.StudentDayRow:
    properties:
      period_number:
        type: integer
      remarks:
        type: string
      session_date:
        type: string
      status:
        type: string
      subject_name:
        type: string
    type: object
  repository.StudentSummaryRow:
    properties:
      attendance_pct:
        type: number
      period_name:
        type: string
      period_number:
        type: integer
      present_count:
        type: integer
      subject_name:
        type: string
      total_count:
        type: integer
    type: object
  repository.TrendRow:
    properties:
      attendance_pct:
        type: number
      bucket:
        type: string
      present_count:
        type: integer
      total_count:
        type: integer
    type: object
  services.RosterEntry:
    properties:
      full_name:
        type: string
      remarks:
        type: string
      roll_number:
        type: string
      status:
        description: nil = unmarked
        type: string
      student_id:
        type: string
    type: object
  services.SessionWithRoster:
    properties:
      roster:
        items:
          $ref: '#/definitions/services.RosterEntry'
        type: array
      session:
        $ref: '#/definitions/models.AttendanceSession'
    type: object
  services.StudentSummaryResponse:
    properties:
      by_subject:
        items:
          $ref: '#/definitions/repository.StudentSummaryRow'
        type: array
      daily_log:
        items:
          $ref: '#/definitions/repository.StudentDayRow'
        type: array
      from:
        type: string
      overall_pct:
        type: number
      student_id:
        type: string
      to:
        type: string
    type: object
info:
  contact:
    email: backend@school-attendance.edu
    name: Backend Team
  description: Multi-tenant REST API for school/college attendance management.
  license:
    name: MIT
  title: Attendance Management API
  version: "1.0"
paths:
  /api/v1/academic-years:
    get:
      consumes:
      - application/json
      description: Returns all academic years configuration for the school.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.AcademicYear'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/httpx.ErrBody'
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/httpx.ErrBody'
              type: object
      security:
      - Bearer: []
      summary: List all academic years
      tags:
      - Academic Years
    post:
      consumes:
      - application/json
      description: Registers a new academic session/year for the school.
      parameters:
      - description: Academic year creation payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateAcademicYearRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/models.AcademicYear'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/httpx.ErrBody'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/httpx.ErrBody'
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/httpx.ErrBody'
              type: object
        "409":
          description: Conflict
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/httpx.ErrBody'
              type: object
      security:
      - Bearer: []
      summary: Create a new academic year
      tags:
      - Academic Years
  /api/v1/academic-years/{id}/archive:
    patch:
      consumes:
      - application/json
      description: Archives a past academic year to prevent modifications.
      parameters:
      - description: Academic Year ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/httpx.ErrBody'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/httpx.ErrBody'
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/httpx.ErrBody'
              type: object
      security:
      - Bearer: []
      summary: Archive an academic year
      tags:
      - Academic Years
  /api/v1/academic-years/{id}/set-current:
    patch:
      consumes:
      - application/json
      description: Activates a specific academic year session as the current active
        session.
      parameters:
      - description: Academic Year ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/httpx.ErrBody'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/httpx.ErrBody'
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/httpx.ErrBody'
              type: object
      security:
      - Bearer: []
      summary: Set current active academic year
      tags:
      - Academic Years
  /api/v1/academic-years/{id}/unarchive:
    patch:
      consumes:
      - application/json
      description: Restores an archived academic year back to available state.
      parameters:
      - description: Academic Year ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/httpx.ErrBody'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/httpx.ErrBody'
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/httpx.ErrBody'
              type: object
      security:
      - Bearer: []
      summary: Unarchive an academic year
      tags:
      - Academic Years
  /api/v1/academic-years/copy-classes:
    post:
      consumes:
      - application/json
      description: Duplicates classes setup from a source academic year into a target
        academic year.
      parameters:
      - description: Copy classes request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CopyClassesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: copied count
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Envelope'
            - properties:
                data:
                  additionalProperties:
                    type: integer
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/httpx.ErrBody'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/httpx.ErrBody'
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/httpx.ErrBody'
              type: object
      security:
      - Bearer: []
      summary: Copy classes schema to target academic year
      tags:
      - Academic Years
  /api/v1/academic-years/copy-teachers:
    post:
      consumes:
      - application/json
      description: Copies teacher-to-class mapping from a source academic year to
        a target academic year.
      parameters:
      - description: Copy teachers request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CopyTeachersRequest'
      produces:
      - application/json
      responses:
        "200":
          description: copied count
          schema:
            allOf:
            - $ref: '#/definitions/httpx.Envelope'
            - properties:
                data:
                  additionalProperties:
                    type: integer
                  type: object
              type: object
        "400":
