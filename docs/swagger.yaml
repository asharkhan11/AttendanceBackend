  /api/v1/webhooks/whatsapp:
    get:
      consumes:
      - text/plain
      description: Handles Meta GET verification request for the WhatsApp Business
        Webhook using hub challenge.
      parameters:
      - description: Subscribe mode
        in: query
        name: hub.mode
        required: true
        type: string
      - description: Verification token
        in: query
        name: hub.verify_token
        required: true
        type: string
      - description: Challenge token to be echoed back
        in: query
        name: hub.challenge
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: hub.challenge value
          schema:
            type: string
        "403":
          description: 'Forbidden: verification token mismatch'
          schema:
            type: string
      summary: Verify WhatsApp webhook
      tags:
      - Webhook
    post:
      consumes:
      - application/json
      description: Handles incoming POST events (status updates like sent/delivered/read/failed
        or incoming messages) from Meta.
      parameters:
      - description: HMAC SHA256 signature in X-Hub-Signature-256 header
        in: header
        name: signature-header
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: EVENT_RECEIVED
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: 'Unauthorized: invalid signature'
          schema:
            type: string
      summary: Handle WhatsApp webhook notifications
      tags:
      - Webhook
